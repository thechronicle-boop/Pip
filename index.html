<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pip</title>
<meta name="description" content="Pip: a fluffy baby penguin that lives in your browser. Feed it, bathe it, tuck it in and play games for coins.">
<meta name="theme-color" content="#bcd3f0">
<link rel="icon" href="pip.webp">
<link rel="preload" as="image" href="pip.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ LOADING SCREEN ============ -->
<section id="loader" class="screen">
  <div class="loader-inner">
    <img class="loader-pet" src="pip.webp" alt="Pip the penguin" draggable="false">
    <h1 class="logo">Pip</h1>
    <p class="tagline">your fluffy little penguin</p>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <p class="loading-text" id="loadingText">Fluffing feathers…</p>
    <button class="btn big" id="playBtn" hidden>Play</button>
  </div>
</section>

<!-- ============ MAIN APP ============ -->
<div id="app" hidden>
  <header class="hud">
    <div class="meters">
      <div class="meter" data-stat="hunger" title="Hunger"><span>🍎</span></div>
      <div class="meter" data-stat="clean" title="Clean"><span>🫧</span></div>
      <div class="meter" data-stat="energy" title="Energy"><span>🌙</span></div>
      <div class="meter" data-stat="fun" title="Fun"><span>⭐</span></div>
    </div>
    <div class="hud-right">
      <div class="pill" id="levelPill">Lv <b id="levelNum">1</b><i class="xp"><i id="xpFill"></i></i></div>
      <div class="pill coins">🪙 <b id="coinNum">0</b></div>
      <button class="icon-btn" id="muteBtn" aria-label="Sound on or off">🔊</button>
    </div>
  </header>

  <main id="room" data-room="kitchen">
    <div class="room-deco" aria-hidden="true"></div>
    <h2 class="room-title" id="roomTitle">Kitchen</h2>

    <div id="petWrap">
      <div id="thought" hidden></div>
      <div id="zzz" hidden><span>z</span><span>z</span><span>Z</span></div>
      <div id="pet" aria-label="Pip, your penguin">
        <div id="petBody">
          <div id="petTilt">
            <img id="petImg" src="pip.webp" alt="" draggable="false">
            <svg id="petFx" viewBox="0 0 551 669" aria-hidden="true">
              <defs>
                <mask id="furMask" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="551" height="669">
                  <image href="pip.webp" x="0" y="0" width="551" height="669"/>
                </mask>
                <filter id="softEdge" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
              </defs>
              <g id="dirt" mask="url(#furMask)">
                <g filter="url(#softEdge)">
                  <ellipse cx="190" cy="470" rx="26" ry="20"/><ellipse cx="228" cy="500" rx="13" ry="10"/>
                  <ellipse cx="360" cy="560" rx="30" ry="22"/><ellipse cx="330" cy="590" rx="12" ry="9"/>
                  <ellipse cx="150" cy="150" rx="20" ry="16"/><ellipse cx="400" cy="420" rx="16" ry="13"/>
                  <ellipse cx="90" cy="400" rx="18" ry="14"/><ellipse cx="480" cy="330" rx="15" ry="12"/>
                  <ellipse cx="300" cy="120" rx="14" ry="11"/>
                </g>
              </g>
              <g id="lids">
                <g filter="url(#softEdge)">
                  <ellipse cx="270" cy="219" rx="47" ry="43" fill="#e9e7ed"/>
                  <ellipse cx="421" cy="220" rx="27" ry="40" fill="#efe9e3"/>
                </g>
                <path d="M232 226 Q270 250 308 226" fill="none" stroke="#2b2836" stroke-width="6" stroke-linecap="round"/>
                <path d="M404 224 Q421 242 438 222" fill="none" stroke="#2b2836" stroke-width="5" stroke-linecap="round"/>
              </g>
              <circle id="beakPt" cx="362" cy="262" r="3" fill="none"/>
              <g id="bubbles" mask="url(#furMask)"></g>
              <g id="hat"></g>
            </svg>
          </div>
        </div>
      </div>
      <div id="shower" hidden></div>
    </div>

    <section id="panel" class="panel"></section>
  </main>

  <nav class="rooms" id="roomNav">
    <button data-room="kitchen"><span>🍳</span>Kitchen</button>
    <button data-room="bath"><span>🛁</span>Bath</button>
    <button data-room="bed"><span>🌙</span>Bed</button>
    <button data-room="play"><span>🎮</span>Play</button>
    <button data-room="closet"><span>🎀</span>Closet</button>
    <button data-room="shop"><span>🛒</span>Shop</button>
  </nav>
</div>

<!-- ============ MINI-GAME OVERLAY ============ -->
<section id="game" hidden>
  <div class="game-bar">
    <button class="icon-btn" id="gameClose" aria-label="Quit game">✕</button>
    <div class="pill" id="gameScore">0</div>
    <div class="pill" id="gameLives"></div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div class="game-hint" id="gameHint"></div>
</section>

<div id="sponge" hidden>🧽</div>
<div id="toast" hidden></div>
<div id="modal" hidden><div class="modal-card" id="modalCard"></div></div>

<script src="game.js"></script>
</body>
</html>
